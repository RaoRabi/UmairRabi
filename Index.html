*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#050805;color:white;overflow-x:hidden}
canvas#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.7}
.nav{position:fixed;top:0;width:100%;padding:20px 6%;display:flex;justify-content:space-between;z-index:10;backdrop-filter:blur(10px);background:rgba(0,0,0,0.4)}
.nav span{color:#7CFF7A;border:1px solid #7CFF7A;padding:6px 16px;border-radius:20px;font-size:12px;letter-spacing:1px}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 6%;position:relative}
.tag{display:inline-block;border:1px solid #7CFF7A;color:#7CFF7A;padding:8px 18px;border-radius:30px;font-size:13px;letter-spacing:2px;width:fit-content;box-shadow:0 0 15px rgba(124,255,122,0.4)}

.hero h1 span{color:#7CFF7A}
.hero p{max-width:650px;color:#b5b5b5;font-size:clamp(16px,2vw,20px);line-height:1.7}
.btns{margin-top:30px;display:flex;gap:18px;flex-wrap:wrap}
.btn-primary{background:#7CFF7A;color:black;padding:14px 28px;border-radius:30px;font-weight:700;text-decoration:none;transition:0.3s}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(124,255,122,0.5)}
.btn-outline{border:1px solid #7CFF7A;color:#7CFF7A;padding:14px 28px;border-radius:30px;font-weight:600;text-decoration:none}
.cards{padding:0 6%;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:-60px;position:relative;z-index:2}
.card{background:linear-gradient(180deg,rgba(20,30,20,0.9),rgba(5,10,5,0.9));border:1px solid rgba(124,255,122,0.3);padding:30px;border-radius:18px;backdrop-filter:blur(20px);transform:translateY(100px);opacity:0;transition:all 0.8s}
.card.show{transform:translateY(0);opacity:1}
.section{padding:100px 6%}
.section h2{font-size:42px;margin-bottom:40px}
.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.proj{background:#0f1710;border:1px solid #1e3a1e;padding:24px;border-radius:16px;transform:translateY(50px);opacity:0;transition:0.8s}
.proj.show{transform:translateY(0);opacity:1}
.proj h4{color:#7CFF7A;margin-bottom:8px}
.proj p{color:#999;font-size:14px;line-height:1.6}
.contact{text-align:center;padding:80px 6%;background:linear-gradient(0deg,#0a1a0a,transparent)}
.reveal{opacity:0;transform:translateY(30px);transition:0.8s}
.reveal.show{opacity:1;transform:translateY(0)}
